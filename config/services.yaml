parameters: { }

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\services\ServicesCSV:
    arguments:
      $rootDir: '%kernel.project_dir%'
