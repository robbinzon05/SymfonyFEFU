api_platform:
  title: 'Cabin Booking API'
  description: 'REST API для бронирования домиков.'
  version: '1.0.0'

  mapping:
    paths:
      - '%kernel.project_dir%/src/Entity'

  enable_swagger: true
  enable_swagger_ui: true
  
  swagger:
    api_keys:
      access_token:
        name: Authorization
        type: header