services:
  php:
    build: ./docker/php
    environment:
      APP_ENV: ${APP_ENV}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    build: ./docker/nginx
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - php
    restart: unless-stopped

  db:
    build: ./docker/db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
